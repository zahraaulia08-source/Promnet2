<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tabel Data Mahasiswa</title>
  </head>
  <body>
    <h1>Nilai Praktikum Mahasiswa</h1>
    <table border="1">
      <thead>
        <tr>
          <th rowspan="2">No.</th>
          <th rowspan="2">Nama</th>
          <th colspan="2">Nilai</th>
        </tr>
        <tr>
          <th>Tugas</th>
          <th>Praktikum</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Alya Putri</td>
          <td>85</td>
          <td>90</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bima Saputra</td>
          <td>87</td>
          <td>92</td>
        </tr>
        <tr>
          <td colspan="2"><strong>Rata-rata</strong></td>
          <td>86</td>
          <td>91</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
